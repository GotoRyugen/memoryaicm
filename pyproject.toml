[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryaicm"
version = "0.5.0"
description = "Mémoire tri-couche pour agents LLM : journal append-only, index ACT-R, sommeil, adaptateur compilé, validateur hors modèle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
memoryaicm = "memoryaicm.cli:main"

[tool.setuptools.packages.find]
include = ["memoryaicm*"]

[tool.setuptools.package-data]
memoryaicm = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
