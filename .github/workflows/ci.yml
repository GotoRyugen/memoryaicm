name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          MEMORYAICM_NO_DOTENV: "1"
      - name: auto-test du serveur MCP
        run: python -m memoryaicm --home ${{ runner.temp }}/mem mcp --selftest
        env:
          MEMORYAICM_NO_DOTENV: "1"

  package:
    name: paquet (sdist + wheel)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: le paquet ne contient ni .env ni données
        run: |
          tar tzf dist/*.tar.gz | grep -E '(^|/)\.env$|/data/journal|\.sqlite' && exit 1 || echo "OK"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
